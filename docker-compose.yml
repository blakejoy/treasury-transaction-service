# Local-development Postgres, matching the engine used in prod and in the
# Testcontainers integration test. The app's default `dev` profile uses in-memory
# H2 and needs none of this; bring this up only to run against real Postgres
# (`make run-postgres`) or to point the `postgres` profile at a local DB.
services:
  postgres:
    image: postgres:16-alpine
    container_name: transactions-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transactions}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
